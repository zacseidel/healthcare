name: Refresh strategy narrative

on:
  workflow_dispatch:
    inputs:
      share_url: https://chatgpt.com/share/6a67c29c-e150-83e8-86ca-7189577413be
        description: ChatGPT share URL to refresh and save for future full updates
        required: true
        type: string
        default: https://chatgpt.com/share/6a70f023-5050-83e8-91b8-5ffa9e09b7a4
      report:
        description: Report narrative to refresh
        required: true
        default: healthcare
        type: choice
        options:
          - healthcare
          - life-science-device

permissions:
  contents: write

concurrency:
  group: healthcare-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and commit strategy narrative
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the dispatched branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium

      - name: Validate project
        run: python -m healthcare_report validate

      - name: Refresh the narrative from the selected share
        env:
          SHARE_URL: ${{ inputs.share_url }}
        run: python -m healthcare_report refresh-narrative --report "${{ inputs.report }}" --url "$SHARE_URL" | tee narrative-result.json

      - name: Add the refresh summary
        run: |
          echo "## Strategy narrative refresh" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat narrative-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the refreshed narrative
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH")" ]; then
            echo "::error::The branch changed during the refresh. Rerun from the new head."
            exit 1
          fi
          git add -- config/settings.yaml state/narrative.json state/narrative-life-science-device.json
          if git diff --cached --quiet; then
            echo "The strategy narrative and share URL are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh strategy narrative"
          git push origin "HEAD:$BRANCH"
