name: Run full healthcare update

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: America/Denver
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional report date (YYYY-MM-DD); defaults to today in Denver
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: healthcare-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Generate and commit complete update
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium

      - name: Validate configuration and tests
        run: |
          python -m healthcare_report validate
          ruff check src tests
          mypy src
          pytest

      - name: Require the market-data API key
        run: |
          if [ -z "$MASSIVE_API_KEY" ]; then
            echo "::error::Add MASSIVE_API_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Generate the final report
        env:
          REQUESTED_REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=()
          if [ -n "$REQUESTED_REPORT_DATE" ]; then
            args+=(--date "$REQUESTED_REPORT_DATE")
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--force-secondary)
          fi
          python -m healthcare_report run "${args[@]}" | tee report-result.json

      - name: Add the run summary
        run: |
          echo "## Healthcare report" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat report-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build the downloadable standalone report
        id: standalone
        run: |
          report_date=$(python -c 'import json; print(json.load(open("report-result.json"))["report_date"])')
          artifact_path="$RUNNER_TEMP/Healthcare-Intel-$report_date-standalone.html"
          python -m healthcare_report export-standalone --date "$report_date" --output "$artifact_path"
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "name=healthcare-intel-$report_date" >> "$GITHUB_OUTPUT"

      - name: Upload the standalone report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.standalone.outputs.name }}
          path: ${{ steps.standalone.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push the complete update
        id: commit
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
            echo "::error::The branch changed while the report was running. Rerun from the new head."
            exit 1
          fi
          git add -- reports/final site state
          if git diff --cached --quiet; then
            echo "No report, site, or state changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          report_date=$(python -c 'import json; print(json.load(open("report-result.json"))["report_date"])')
          git commit -m "Create healthcare report for $report_date"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  pages:
    name: Publish updated report site
    needs: report
    if: >-
      needs.report.outputs.changed == 'true' &&
      github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/pages.yml
