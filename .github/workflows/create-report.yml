name: Run full healthcare update

on:
  schedule:
    # Off the top of the hour: GitHub delays and sometimes drops scheduled runs at :00.
    - cron: "17 5 * * 1"
      timezone: America/Denver
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional report date (YYYY-MM-DD); defaults to today in Denver
        required: false
        type: string
      report_scope:
        description: Which report to update manually
        required: true
        default: all
        type: choice
        options:
          - all
          - healthcare
          - life-science-device
          - provider-enablement

permissions:
  contents: write
  pages: write

concurrency:
  group: healthcare-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Generate and commit complete update
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-sol
      OPENAI_REASONING_EFFORT: high
      # One retry at most per request, so a stalled response cannot consume the whole job.
      OPENAI_TIMEOUT_SECONDS: "600"
      OPENAI_MAX_RETRIES: "1"
      REPORT_HISTORY_COUNT: "4"
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip reports already created today
        id: guard
        env:
          TZ: America/Denver
          REQUESTED_SCOPE: ${{ inputs.report_scope || 'all' }}
        run: |
          profiles=(healthcare life-science-device provider-enablement)
          scope="$REQUESTED_SCOPE"
          if [ "$scope" = "all" ]; then scope=$(IFS=,; echo "${profiles[*]}"); fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            today=$(date +%F)
            remaining=()
            for profile in "${profiles[@]}"; do
              folder="reports/final/$profile/$today"
              if [ "$profile" = "healthcare" ]; then folder="reports/final/$today"; fi
              committed=$(git log -1 --date=format-local:%F --format=%cd -- "$folder")
              if [ "$committed" = "$today" ]; then
                echo "::notice::Skipping $profile: its $today report was already committed today."
              else
                remaining+=("$profile")
              fi
            done
            scope=$(IFS=,; echo "${remaining[*]}")
            if [ -z "$scope" ]; then scope=none; fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.scope != 'none'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        if: steps.guard.outputs.scope != 'none'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium

      - name: Validate configuration and tests
        if: steps.guard.outputs.scope != 'none'
        run: |
          python -m healthcare_report validate
          ruff check src tests
          mypy src
          pytest

      - name: Require API keys
        if: steps.guard.outputs.scope != 'none'
        run: |
          if [ -z "$MASSIVE_API_KEY" ]; then
            echo "::error::Add MASSIVE_API_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Generate the final report
        if: steps.guard.outputs.scope != 'none'
        # A step timeout (unlike the job timeout) still lets the save-on-failure step run.
        timeout-minutes: 90
        env:
          REQUESTED_REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=()
          if [ -n "$REQUESTED_REPORT_DATE" ]; then
            args+=(--date "$REQUESTED_REPORT_DATE")
          fi
          args+=(--report "${{ steps.guard.outputs.scope }}")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--force-secondary)
          fi
          set -o pipefail
          python -m healthcare_report run "${args[@]}" | tee report-result.json

      - name: Add the run summary
        if: steps.guard.outputs.scope != 'none'
        run: |
          echo "## Healthcare report" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat report-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build the downloadable standalone report
        if: steps.guard.outputs.scope != 'none'
        id: standalone
        run: |
          report_date=$(python -c 'import json; value=json.load(open("report-result.json")); print((value.get("reports") or [value])[0]["report_date"])')
          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/report-artifacts"
          IFS=, read -ra scopes <<< "${{ steps.guard.outputs.scope }}"
          for scope in "${scopes[@]}"; do
            python -m healthcare_report export-standalone --report "$scope" --date "$report_date" \
              --output "$RUNNER_TEMP/report-artifacts/$scope-$report_date.html"
          done

      - name: Upload the standalone report
        if: steps.guard.outputs.scope != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-intel-reports-${{ steps.standalone.outputs.report_date }}
          path: ${{ runner.temp }}/report-artifacts/*.html
          if-no-files-found: error
          retention-days: 90

      - name: Commit and push the complete update
        if: steps.guard.outputs.scope != 'none'
        id: commit
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git add -- docs reports/final reports/strategy state
          if git diff --cached --quiet; then
            echo "No report, site, or state changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          report_date=$(python -c 'import json; value=json.load(open("report-result.json")); print((value.get("reports") or [value])[0]["report_date"])')
          git commit -m "Create healthcare report for $report_date"
          # Commits pushed while the report ran (prompt or code edits) touch other paths, so
          # replay the generated output on top of them instead of discarding a paid run.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort
              echo "::error::Generated files conflict with commits pushed during the run. Download the unsaved-report-output artifact to recover them."
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the report after three attempts."
          exit 1

      - name: Save generated output when the run fails
        if: (failure() || cancelled()) && steps.guard.outputs.scope != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-report-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/strategy
            reports/final
            state
            docs
            report-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Request the branch-based Pages build
        if: >-
          steps.commit.outputs.changed == 'true' &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
