name: Update strategy narrative

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strategy-narrative-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Refresh and commit snapshot
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the dispatched branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Refresh the narrative snapshot
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tools/export-strategy-narrative.mjs

      - name: Commit and push an updated snapshot
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -- inputs/strategy-narrative.json
          if git diff --cached --quiet; then
            echo "The strategy narrative snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update strategy narrative snapshot"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
